[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exec-engine"
version = "0.1.0"
description = "Minimal execution engine — uniform order management across any broker API."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["exec_engine*"]
